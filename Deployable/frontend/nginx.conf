server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Every unknown path falls back to index.html. The app is a single
    # page with in-memory view state (no client-side router yet), so
    # today this only matters for a hard refresh on "/" -- but it's the
    # correct default for any static SPA deployment and costs nothing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
